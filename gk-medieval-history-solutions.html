const TOTAL=70,PLUS=4,MINUS=1,MAXM=280;
let resp=[],hasCode=false;

function again(){document.getElementById('entry-ov').style.display='flex';document.getElementById('inp-code').value='';document.getElementById('entry-err').textContent='';}

function loadBlank(){
  resp=new Array(TOTAL).fill(null);hasCode=false;
  document.getElementById('h-student').textContent='Answer key view';
  document.getElementById('entry-ov').style.display='none';
  render();
}

function loadCode(){
  const err=document.getElementById('entry-err');
  let raw=document.getElementById('inp-code').value.trim().toUpperCase().replace(/\s+/g,'');
  if(!raw){err.textContent='Please paste your response code.';return;}
  const cut=raw.indexOf('-');
  if(cut<1){err.textContent='That does not look like a response code. It should read like 1234567-ABDCA...';return;}
  const tail=raw.slice(0,cut), letters=raw.slice(cut+1);
  if(letters.length!==TOTAL){
    err.textContent='This code has '+letters.length+' answers but the test had '+TOTAL+'. Please check you pasted the whole code.';return;
  }
  if(!/^[ABCD-]+$/.test(letters)){err.textContent='The code contains characters other than A, B, C, D and dashes.';return;}
  resp=letters.split('').map(ch=>ch==='-'?null:L.indexOf(ch));
  hasCode=true;
  const rec=WHO[tail];
  document.getElementById('h-student').textContent=rec?(rec[0]+'  \u00b7  '+rec[1]):('PIN '+tail);
  document.getElementById('entry-ov').style.display='none';
  render(rec,tail);
}

function render(rec,tail){
  let correct=0,wrong=0,skip=0,total=0;
  Q.forEach((q,i)=>{
    const r=resp[i];
    if(r===null||r===undefined){skip++;}
    else if(r===K[i]){correct++;total+=PLUS;}
    else{wrong++;total-=MINUS;}
  });
  total=Math.round(total*100)/100;
  const acc=(correct+wrong)?Math.round(correct/(correct+wrong)*100):0;
  const neg=Math.round(wrong*MINUS*100)/100;

  const sum=document.getElementById('summary');
  if(hasCode){
    sum.innerHTML=
      '<div class="s-strip">'+
        '<span>&#128100; <strong>'+(rec?rec[0]:'PIN '+tail)+'</strong></span>'+
        '<span>Batch: <strong>'+(rec?rec[1]:'&mdash;')+'</strong></span>'+
        '<span>Attempted: <strong>'+(correct+wrong)+' of '+TOTAL+'</strong></span>'+
      '</div>'+
      '<div class="score-grid">'+
        '<div class="sc"><div class="sc-label">Net Score</div><div class="sc-val blue">'+total+'</div><div style="font-size:10px;color:#888;margin-top:4px">out of '+MAXM+'</div></div>'+
        '<div class="sc"><div class="sc-label">Accuracy</div><div class="sc-val gld">'+acc+'%</div><div style="font-size:10px;color:#888;margin-top:4px">'+correct+' of '+(correct+wrong)+'</div></div>'+
        '<div class="sc"><div class="sc-label">Correct</div><div class="sc-val grn">+'+(correct*PLUS)+'</div><div style="font-size:10px;color:#888;margin-top:4px">'+correct+' questions</div></div>'+
        '<div class="sc"><div class="sc-label">Wrong</div><div class="sc-val" style="color:var(--red)">&minus;'+neg+'</div><div style="font-size:10px;color:#888;margin-top:4px">'+wrong+' questions</div></div>'+
      '</div>';
    document.getElementById('n-wrong').textContent='('+wrong+')';
    document.getElementById('n-skip').textContent='('+skip+')';
    document.getElementById('n-correct').textContent='('+correct+')';
    document.getElementById('rtabs').style.display='flex';
  }else{
    sum.innerHTML='<div class="banner">&#128273; <strong>Answer key view.</strong> Correct options are marked in green. To see which ones you personally got wrong, reload this page and paste your response code.</div>';
    document.getElementById('rtabs').style.display='none';
  }

  document.getElementById('list').innerHTML=Q.map((q,i)=>{
    const r=resp[i];
    const st=(r===null||r===undefined)?'skip':(r===K[i]?'correct':'wrong');
    const stTxt={correct:'Correct',wrong:'Incorrect',skip:'Not attempted'}[st];
    const stCls={correct:'ok',wrong:'no',skip:'sk'}[st];
    let opts='';
    q.options.forEach((o,k)=>{
      let cls='rq-o',tag='';
      if(k===K[i]){cls+=' correct';tag='<span class="tagm g">Correct answer</span>';}
      else if(hasCode&&k===r){cls+=' wrong';tag='<span class="tagm r">Your answer</span>';}
      opts+='<div class="'+cls+'"><span class="lbl">'+L[k]+'.</span><span>'+o+'</span>'+tag+'</div>';
    });
    const hdr=hasCode
      ? '<span style="font-size:11.5px;color:var(--subtext)">You marked: <strong style="color:var(--text)">'+((r===null||r===undefined)?'\u2014':L[r])+'</strong> &nbsp;&middot;&nbsp; Key: <strong style="color:var(--green)">'+L[K[i]]+'</strong></span><span class="rq-st '+stCls+'">'+stTxt+'</span>'

    return '<div class="rq" data-st="'+st+'">'+
             '<div class="rq-hdr"><span class="rq-num">Q.'+q.id+'</span>'+hdr+'</div>'+
             '<div class="rq-q">'+q.text+'</div>'+opts+
           '</div>';
  }).join('');
  setFilter('all',document.querySelector('.rtab'));
  window.scrollTo(0,0);
}

function setFilter(f,btn){
  document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.querySelectorAll('.rq').forEach(el=>{
    el.style.display=(f==='all'||el.dataset.st===f)?'':'none';
  });
}

document.getElementById('inp-code').addEventListener('keydown',e=>{if(e.key==='Enter')loadCode();});
