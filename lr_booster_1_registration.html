<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LR Booster 1 Registration — IMS Ahmedabad</title>
<style>
  :root{
    --navy:#27404F;
    --navy-deep:#1C2E3A;
    --slate:#3D5A73;
    --coral:#E76F51;
    --coral-deep:#C85A3E;
    --ice:#EEF2F5;
    --ice-2:#DCE3E8;
    --line:#C7D3DC;
    --ink:#263238;
    --error:#C0392B;
    --white:#FFFFFF;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--ice);
    font-family:Verdana, Geneva, "Segoe UI", sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 16px 64px;
  }

  .card{
    width:100%;
    max-width:520px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:32px 28px 28px;
    box-shadow:0 1px 2px rgba(28,46,58,0.04), 0 8px 24px rgba(28,46,58,0.06);
  }

  .eyebrow{
    color:var(--coral);
    font-size:12.5px;
    font-weight:bold;
    letter-spacing:0.04em;
    margin-bottom:8px;
  }

  h1{
    color:var(--navy);
    font-size:22px;
    line-height:1.3;
    margin:0 0 6px;
  }

  .subtitle{
    color:var(--slate);
    font-size:14px;
    line-height:1.5;
    margin:0 0 26px;
  }

  .section{
    margin-bottom:20px;
  }

  label{
    display:block;
    font-size:13.5px;
    font-weight:bold;
    color:var(--navy-deep);
    margin-bottom:7px;
  }

  .hint{
    display:block;
    font-size:12px;
    font-weight:normal;
    color:var(--slate);
    margin-top:5px;
  }

  .req{
    color:var(--coral-deep);
    font-weight:bold;
  }

  input[type="text"],
  select{
    width:100%;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
    appearance:none;
    -webkit-appearance:none;
  }

  select{
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%233D5A73'%3e%3cpath fill-rule='evenodd' d='M5.23 7.21a.75.75 0 011.06.02L10 11.06l3.71-3.83a.75.75 0 111.08 1.04l-4.25 4.39a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z' clip-rule='evenodd'/%3e%3c/svg%3e");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:18px;
    padding-right:36px;
  }

  input[type="text"]:focus,
  select:focus{
    border-color:var(--coral);
    box-shadow:0 0 0 3px rgba(231,111,81,0.15);
  }

  input[type="text"]:disabled{
    background:var(--ice);
    cursor:not-allowed;
  }

  input.readonly-field{
    background:var(--ice);
    color:var(--navy-deep);
    font-weight:bold;
    cursor:not-allowed;
  }

  .field-error input[type="text"],
  .field-error select,
  .field-error .combobox input[type="text"]{
    border-color:var(--error);
  }

  .error{
    color:var(--error);
    font-size:12.5px;
    margin-top:6px;
    min-height:0;
    display:none;
  }

  .field-error .error{
    display:block;
  }

  /* Searchable Student Name combobox */
  .combobox{
    position:relative;
  }

  .combobox-list{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    max-height:220px;
    overflow-y:auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 8px 20px rgba(28,46,58,0.12);
    z-index:20;
  }

  .combobox-list.open{
    display:block;
  }

  .combobox-option{
    padding:10px 12px;
    font-size:14.5px;
    cursor:pointer;
  }

  .combobox-option:hover,
  .combobox-option.active{
    background:var(--ice);
  }

  .combobox-empty{
    padding:10px 12px;
    font-size:13.5px;
    color:var(--slate);
  }

  /* Slot cards (date + time combined) */
  .slot-cards{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .slot-card{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:inherit;
    width:100%;
    padding:13px 14px;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }

  .slot-card:active{
    transform:scale(0.99);
  }

  .slot-dot{
    width:16px;
    height:16px;
    border-radius:50%;
    border:1.5px solid var(--line);
    flex-shrink:0;
    position:relative;
    transition:border-color .15s ease;
  }

  .slot-dot::after{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:50%;
    background:var(--coral);
    opacity:0;
    transition:opacity .1s ease;
  }

  .slot-card.selected{
    border-color:var(--coral);
    background:rgba(231,111,81,0.08);
  }

  .slot-card.selected .slot-dot{
    border-color:var(--coral);
  }

  .slot-card.selected .slot-dot::after{
    opacity:1;
  }

  .slot-text .slot-date{
    font-size:14.5px;
    font-weight:bold;
    color:var(--navy-deep);
  }

  .slot-text .slot-time{
    font-size:13px;
    color:var(--slate);
    margin-top:2px;
  }

  /* Confirmation */
  .checkbox-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:13.5px;
    font-weight:normal;
    color:var(--ink);
    line-height:1.5;
    cursor:pointer;
  }

  .checkbox-row input{
    margin-top:3px;
    width:17px;
    height:17px;
    accent-color:var(--coral);
    flex-shrink:0;
    cursor:pointer;
  }

  /* Banner */
  .form-banner{
    font-size:13.5px;
    padding:11px 13px;
    border-radius:8px;
    margin-bottom:18px;
  }

  .form-banner.error{
    background:#FBEAE8;
    color:var(--error);
    border:1px solid #F0C7C1;
  }

  /* Submit button */
  .submit-btn{
    width:100%;
    font-family:inherit;
    font-size:15.5px;
    font-weight:bold;
    color:var(--white);
    background:var(--coral);
    border:none;
    border-radius:9px;
    padding:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:background .15s ease;
  }

  .submit-btn:hover{
    background:var(--coral-deep);
  }

  .submit-btn:disabled{
    background:var(--ice-2);
    color:var(--slate);
    cursor:not-allowed;
  }

  .spinner{
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,0.5);
    border-top-color:var(--white);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }

  .submit-btn:disabled .spinner{
    border:2px solid rgba(61,90,115,0.3);
    border-top-color:var(--slate);
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  /* Success state */
  .success-state{
    text-align:center;
    padding:12px 4px 4px;
  }

  .success-icon{
    width:52px;
    height:52px;
    margin:0 auto 16px;
    border-radius:50%;
    background:var(--navy);
    color:var(--white);
    font-size:26px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .success-state h2{
    color:var(--navy);
    font-size:19px;
    margin:0 0 8px;
  }

  .success-state p{
    color:var(--slate);
    font-size:14px;
    margin:0 0 18px;
    line-height:1.5;
  }

  .success-summary{
    text-align:left;
    background:var(--ice);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }

  .success-summary div{
    display:flex;
    justify-content:space-between;
    font-size:13.5px;
    padding:6px 0;
    border-bottom:1px solid var(--ice-2);
  }

  .success-summary div:last-child{
    border-bottom:none;
  }

  .success-summary span:first-child{
    color:var(--slate);
  }

  .success-summary span:last-child{
    color:var(--navy-deep);
    font-weight:bold;
    text-align:right;
  }
</style>
</head>
<body>

<div class="page">
  <div class="card">
    <div class="eyebrow" id="lectureEyebrow"></div>
    <h1 id="lectureTitle"></h1>
    <p class="subtitle" id="lectureSubtitle"></p>

    <form id="regForm" novalidate>

      <div class="section" id="group-batch">
        <label for="batch">Batch <span class="req">*</span></label>
        <select id="batch" name="batch">
          <option value="" disabled selected>Select your batch</option>
        </select>
        <div class="error" id="err-batch">Please select your batch.</div>
      </div>

      <div class="section" id="group-studentName">
        <label for="nameSearch">Student Name <span class="req">*</span></label>
        <div class="combobox" id="nameCombobox">
          <input type="text" id="nameSearch" autocomplete="off" placeholder="Select your batch first" role="combobox" aria-expanded="false" aria-autocomplete="list" disabled>
          <input type="hidden" id="studentName" name="studentName">
          <div class="combobox-list" id="nameList" role="listbox"></div>
        </div>
        <div class="error" id="err-studentName">Please select your name from the list.</div>
      </div>

      <div class="section" id="group-imsPin">
        <label for="imsPin">IMS PIN</label>
        <input type="text" id="imsPin" name="imsPin" class="readonly-field" readonly placeholder="Auto-fills after you select your name">
        <span class="hint">Fills in automatically once you select your name above.</span>
      </div>

      <div class="section" id="group-slot">
        <label>Preferred Date &amp; Time <span class="req">*</span></label>
        <div class="slot-cards" id="slotCards"></div>
        <input type="hidden" id="preferredDate" name="preferredDate">
        <input type="hidden" id="preferredTime" name="preferredTime">
        <div class="error" id="err-slot">Please select one date &amp; time slot.</div>
      </div>

      <div class="section" id="group-confirmation">
        <label class="checkbox-row" for="confirmation">
          <input type="checkbox" id="confirmation" name="confirmation">
          <span>I am booking this slot and confirm that I will attend the lecture at the selected date and time.</span>
        </label>
        <div class="error" id="err-confirmation">Please confirm before booking.</div>
      </div>

      <div class="form-banner error" id="formBanner" hidden></div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-label">Book My Slot</span>
        <span class="spinner" id="spinner" hidden></span>
      </button>
    </form>

    <div class="success-state" id="successState" hidden>
      <div class="success-icon">&#10003;</div>
      <h2>Slot booked successfully!</h2>
      <p>Please make a note of your selected date and time.</p>
      <div class="success-summary" id="successSummary"></div>
    </div>

  </div>
</div>

function formatDate(iso){
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-IN", { weekday:"short", day:"numeric", month:"short", year:"numeric" });
}

// Populate Batch (unique values straight from the roster)
const batchSelect = document.getElementById("batch");
const uniqueBatches = [...new Set(CONFIG.ROSTER.map(r => r.batch))].sort();
uniqueBatches.forEach(b => {
  const opt = document.createElement("option");
  opt.value = b; opt.textContent = b;
  batchSelect.appendChild(opt);
});

// Student Name combobox — filtered by selected batch, auto-fills IMS PIN
const nameInput = document.getElementById("nameSearch");
const nameHidden = document.getElementById("studentName");
const nameList = document.getElementById("nameList");
const nameCombobox = document.getElementById("nameCombobox");
const pinField = document.getElementById("imsPin");

batchSelect.addEventListener("change", () => {
  nameHidden.value = "";
  nameInput.value = "";
  pinField.value = "";
  nameInput.disabled = !batchSelect.value;
  nameInput.placeholder = batchSelect.value ? "Search and select your name" : "Select your batch first";
  clearFieldError("batch");
  clearFieldError("studentName");
});

function renderNameList(filter){
  const b = batchSelect.value;
  const f = filter.trim().toLowerCase();
  const matches = CONFIG.ROSTER.filter(r => r.batch === b && r.name.toLowerCase().includes(f));
  nameList.innerHTML = "";
  if (matches.length === 0){
    const empty = document.createElement("div");
    empty.className = "combobox-empty";
    empty.textContent = "No matching name found in this batch";
    nameList.appendChild(empty);
    return;
  }
  matches.slice(0, 50).forEach(r => {
    const item = document.createElement("div");
    item.className = "combobox-option";
    item.setAttribute("role","option");
    item.textContent = r.name;
    item.addEventListener("mousedown", (e) => {
      e.preventDefault();
      selectStudent(r);
    });
    nameList.appendChild(item);
  });
}

function selectStudent(entry){
  nameHidden.value = entry.name;
  nameInput.value = entry.name;
  pinField.value = entry.pin;
  closeNameList();
  clearFieldError("studentName");
}

function openNameList(){
  if (nameInput.disabled) return;
  renderNameList(nameInput.value);
  nameList.classList.add("open");
}

function closeNameList(){
  nameList.classList.remove("open");
}

nameInput.addEventListener("focus", openNameList);
nameInput.addEventListener("input", () => {
  nameHidden.value = "";
  pinField.value = "";
  openNameList();
});
nameInput.addEventListener("blur", () => {
  setTimeout(() => {
    closeNameList();
    if (nameInput.value !== nameHidden.value){
      const match = CONFIG.ROSTER.find(r => r.batch === batchSelect.value && r.name === nameInput.value);
      if (!match){
        nameInput.value = nameHidden.value;
      }
    }
  }, 150);
});
document.addEventListener("click", (e) => {
  if (!nameCombobox.contains(e.target)) closeNameList();
});

// Slot cards (date + time combined)
const slotCardsEl = document.getElementById("slotCards");
const preferredDateHidden = document.getElementById("preferredDate");
const preferredTimeHidden = document.getElementById("preferredTime");

CONFIG.SLOT_OPTIONS.forEach((slot) => {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "slot-card";
  card.dataset.date = slot.date;
  card.dataset.time = slot.time;
  card.innerHTML = `
    <span class="slot-dot"></span>
    <span class="slot-text">
      <span class="slot-date">${formatDate(slot.date)}</span>
      <span class="slot-time">${slot.time}</span>
    </span>
  `;
  card.addEventListener("click", () => {
    document.querySelectorAll(".slot-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    preferredDateHidden.value = slot.date;
    preferredTimeHidden.value = slot.time;
    clearFieldError("slot");
  });
  slotCardsEl.appendChild(card);
});

// Field error helpers
function setFieldError(field){
  document.getElementById("group-" + field).classList.add("field-error");
}
function clearFieldError(field){
  document.getElementById("group-" + field).classList.remove("field-error");
}
function clearAllErrors(){
  ["batch","studentName","slot","confirmation"].forEach(clearFieldError);
}

document.getElementById("confirmation").addEventListener("change", () => clearFieldError("confirmation"));

// Validation
function validate(){
  clearAllErrors();
  let firstInvalid = null;
  const values = {
    batch: batchSelect.value,
    studentName: nameHidden.value,
    imsPin: pinField.value,
    preferredDate: preferredDateHidden.value,
    preferredTime: preferredTimeHidden.value,
    confirmation: document.getElementById("confirmation").checked
  };

  if (!values.batch){ setFieldError("batch"); firstInvalid = firstInvalid || "batch"; }
  if (!values.studentName || !values.imsPin){ setFieldError("studentName"); firstInvalid = firstInvalid || "studentName"; }
  if (!values.preferredDate || !values.preferredTime){ setFieldError("slot"); firstInvalid = firstInvalid || "slot"; }
  if (!values.confirmation){ setFieldError("confirmation"); firstInvalid = firstInvalid || "confirmation"; }

  if (firstInvalid){
    document.getElementById("group-" + firstInvalid).scrollIntoView({ behavior:"smooth", block:"center" });
    return null;
  }
  return values;
}

// Submit
const form = document.getElementById("regForm");
const submitBtn = document.getElementById("submitBtn");
const btnLabel = submitBtn.querySelector(".btn-label");
const spinner = document.getElementById("spinner");
const formBanner = document.getElementById("formBanner");
let isSubmitting = false;

function setLoading(loading){
  submitBtn.disabled = loading;
  spinner.hidden = !loading;
  btnLabel.textContent = loading ? "Booking..." : "Book My Slot";
}

function showBanner(message){
  formBanner.textContent = message;
  formBanner.hidden = false;
}

function hideBanner(){
  formBanner.hidden = true;
}

// Silent submission into the Google Form via a hidden iframe.
// A real cross-origin fetch() to Google's /formResponse endpoint can't have its
// response read by the page, so this uses a genuine (invisible) form POST instead —
// the standard, reliable way to feed an external page into a Google Form.
let hiddenIframe = document.getElementById("hiddenFormTarget");
if (!hiddenIframe) {
  hiddenIframe = document.createElement("iframe");
  hiddenIframe.name = "hiddenFormTarget";
  hiddenIframe.id = "hiddenFormTarget";
  hiddenIframe.style.display = "none";
  document.body.appendChild(hiddenIframe);
}

function submitToGoogleForm(values){
  return new Promise((resolve) => {
    const gForm = document.createElement("form");
    gForm.action = CONFIG.GOOGLE_FORM_ACTION_URL;
    gForm.method = "POST";
    gForm.target = "hiddenFormTarget";
    gForm.style.display = "none";

    const fieldValues = {
      [CONFIG.ENTRY_IDS.studentName]: values.studentName,
      [CONFIG.ENTRY_IDS.batch]: values.batch,
      [CONFIG.ENTRY_IDS.imsPin]: values.imsPin,
      [CONFIG.ENTRY_IDS.preferredDate]: values.preferredDate,
      [CONFIG.ENTRY_IDS.preferredTime]: values.preferredTime
    };

    Object.entries(fieldValues).forEach(([entryId, value]) => {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = "entry." + entryId;
      input.value = value;
      gForm.appendChild(input);
    });

    document.body.appendChild(gForm);
    gForm.submit();
    document.body.removeChild(gForm);

    // Google gives no readable cross-origin confirmation, so assume delivered
    // once the request has had time to reach the server.
    setTimeout(resolve, 1200);
  });
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (isSubmitting) return;

  hideBanner();
  const values = validate();
  if (!values) return;

  isSubmitting = true;
  setLoading(true);

  try {
    await submitToGoogleForm(values);

    form.hidden = true;
    const successState = document.getElementById("successState");
    const summary = document.getElementById("successSummary");
    summary.innerHTML = `
      <div><span>Name</span><span>${values.studentName}</span></div>
      <div><span>Batch</span><span>${values.batch}</span></div>
      <div><span>Date</span><span>${formatDate(values.preferredDate)}</span></div>
      <div><span>Time</span><span>${values.preferredTime}</span></div>
    `;
    successState.hidden = false;
  } catch (err){
    isSubmitting = false;
    setLoading(false);
    showBanner("We could not book your slot. Please check your internet connection and try again.");
  }
});
